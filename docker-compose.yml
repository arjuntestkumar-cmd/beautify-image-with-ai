# Beautify — single-host deployment.
#
#   docker compose up -d --build     start (first build downloads ~528 MB of weights)
#   docker compose logs -f           watch it load the models
#   docker compose down              stop
#
# The container listens on 7860 and is published on port 80. Put Caddy or nginx
# in front of it if you want HTTPS on a domain — see deploy/ORACLE.md.

services:
  beautify:
    build: .
    image: beautify:latest
    container_name: beautify
    restart: unless-stopped
    # Host port 80 by default, exactly as before. Set PUBLISH_ADDR=127.0.0.1:8080 in .env when
    # you turn the `https` profile on below, so Caddy can take 80 and 443 and this stays on
    # loopback where the open internet cannot reach it directly.
    ports:
      - "${PUBLISH_ADDR:-80}:7860"
    # The host's .env, delivered to the app.
    #
    # `.env` is gitignored AND in .dockerignore, on purpose: per-host tuning and anything secret
    # do not belong baked into a built image. The consequence is that dropping a .env next to the
    # code on a server does NOTHING on its own - the container never sees it. This line is what
    # actually delivers it. `required: false` keeps a host that has no .env working exactly as
    # before. Needs Compose v2.24+; `docker compose version` will tell you.
    #
    # Note this is a DIFFERENT mechanism from the .env Compose reads for its own `${VAR}`
    # substitution inside this file. Same filename, same directory, unrelated jobs.
    env_file:
      - path: .env
        required: false

    # Anything here WINS over the .env above, which is the safe direction: a stray PORT in a
    # hand-edited .env cannot detach the app from the port this file publishes.
    environment:
      PORT: "7860"
      # Uncomment to tune. Every value has a working default.
      # AUTO_UPSCALE_MAX_SIDE: "1600"    # lower = faster on big photos
      # RESULT_RETENTION_MINUTES: "30"   # how long a result survives (and how much disk is used)
      # MAX_UPLOAD_BYTES: "67108864"     # 64 MB
      # JOB_TIMEOUT_SECONDS: "900"       # floor; the real deadline scales with megapixels
      # CHUNK_TILE_SIZE: "768"           # lower this first on a memory-starved box
      # MODEL_CHUNK_TILE_SIZE: "384"     # same, for the super-resolution model
      # MAX_QUEUED_JOBS: "64"            # how many people can wait before uploads are refused

    # Loading the models takes a while on a cold start, so the health check is
    # given a long grace period before its first failure counts.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:7860/health',timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      start_period: 240s
      retries: 3

    # Uploads and results are scratch: they are deleted 30 minutes after each job
    # and wiped on every restart, so they deliberately stay inside the container.


  # HTTPS, off unless you ask for it: `docker compose --profile https up -d`.
  #
  # It exists because a bare IP over plain http does not share. WhatsApp will not linkify
  # `http://13.50.105.177/`, and Teams will not load a preview image over http - both are client
  # policy that no meta tag can reach. A hostname with a certificate fixes both, and Caddy gets
  # the certificate by itself.
  #
  # Set SITE_ADDRESS in .env first. With no domain to hand, use sslip.io: it resolves any dashed
  # IP straight back to that IP, so `13-50-105-177.sslip.io` is a real public DNS name that
  # Let's Encrypt will issue a certificate for. Verified resolving to 13.50.105.177.
  caddy:
    image: caddy:2-alpine
    container_name: beautify-caddy
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # A plain default, NOT ${SITE_ADDRESS:?...}. Compose interpolates the whole file before it
      # filters services by profile, so the error form would make `docker compose up -d` fail for
      # everyone who has never touched HTTPS - a service that is switched off must not be able to
      # break the one that is on. Set it in .env before enabling the profile; the Caddyfile says
      # what to set it to.
      SITE_ADDRESS: "${SITE_ADDRESS:-localhost}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here. Losing this volume means re-issuing on every restart, which
      # Let's Encrypt rate-limits, so it is a named volume rather than scratch.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - beautify

volumes:
  caddy-data:
  caddy-config:
